<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17132b"><title>夜市大玩家｜遊戲樂園</title>
<style>
:root{--bg:#100e1d;--panel:#1c1930;--panel2:#282342;--ink:#fff8ed;--muted:#b9b2ca;--gold:#ffc857;--pink:#ff6685;--mint:#72e0bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292044 0,#100e1d 55%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:#151226ed;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff18;padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:19px}.brand span{color:var(--gold)}button{border:0;border-radius:13px;padding:11px 14px;font-weight:800;background:var(--gold);color:#241a25;cursor:pointer}button.secondary{background:#383250;color:white}button.danger{background:#8c3450;color:white}button:disabled{opacity:.4}
main{max-width:1050px;margin:auto;padding:20px 16px 90px}.hero{background:linear-gradient(120deg,#4b2858,#252448 60%,#174d52);border:1px solid #ffffff20;border-radius:24px;padding:24px 20px;margin:12px 0 20px;overflow:hidden}.hero h1{font-size:clamp(27px,6vw,42px);margin:0 0 8px}.hero p{color:#eee3f6;margin:0 0 18px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#ffffff18;border:1px solid #ffffff20;padding:10px 14px;border-radius:14px;min-width:100px}.stat small{display:block;color:#d2c9dc}.stat b{font-size:20px;color:var(--gold)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section-head h2{font-size:21px;margin:0}.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid #ffffff17;border-radius:18px;padding:15px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.emoji{font-size:32px}.game h3{margin:7px 0 3px;font-size:16px}.game p{margin:0 0 12px;color:var(--muted);font-size:12px}.game button{width:100%;padding:10px}
.panel{background:var(--panel);border:1px solid #ffffff20;border-radius:18px;padding:16px;margin:14px 0}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 10px}.tabs button{white-space:nowrap}.tabs .active{background:var(--pink);color:white}
input,select{width:100%;background:#100e1d;color:white;border:1px solid #51496b;border-radius:11px;padding:12px;margin:5px 0 12px;font-size:16px}label{font-size:13px;color:var(--muted)}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}
.hidden{display:none!important}.notice{font-size:12px;color:#f6d99b;line-height:1.6}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:8px;padding:10px;background:#ffffff0b;border-radius:11px;align-items:center}
.modal{position:fixed;inset:0;z-index:10;background:#080711d9;display:grid;place-items:end center;padding:12px}.sheet{background:#201c35;border:1px solid #ffffff25;border-radius:23px 23px 16px 16px;padding:20px;width:min(100%,520px);max-height:88vh;overflow:auto}.sheet h2{margin:0 0 8px}.close{float:right;background:#383250;color:white}
footer{text-align:center;color:#827b94;font-size:11px;padding:25px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal{place-items:center}.hero{padding:32px}}
</style></head>
<body>
<header><div class="brand">🎪 <span>夜市</span>大玩家</div><div class="row" style="flex:0 1 auto"><button class="secondary" id="loginBtn">登入 / 註冊</button><button id="adminBtn" class="secondary">管理後台</button></div></header>
<main>
<section class="hero"><h1>今晚來逛夜市！</h1><p>玩遊戲、賺點數、集收藏，打造你的夜市傳說。</p><div class="stats"><div class="stat"><small>我的點數</small><b id="points">0</b></div><div class="stat"><small>今日登入</small><b id="daily">未領取</b></div><div class="stat"><small>收藏數</small><b id="collection">0 / 500</b></div></div></section>
<div class="section-head"><h2>🎮 遊戲大廳</h2><span class="muted">共 16 款遊戲</span></div><div class="grid" id="games"></div>
<div class="section-head"><h2>🏆 排行榜</h2><span class="muted">本機展示資料</span></div><div class="panel list" id="leaderboard"></div>
<div class="section-head"><h2>🧸 我的收藏</h2><span class="muted">台灣味圖鑑</span></div><div class="panel" id="collectionList">還沒有收藏品，快去玩遊戲吧！</div>
<div class="notice">原型說明：目前資料儲存在這台裝置的瀏覽器，清除瀏覽資料可能會遺失；尚未連接雲端會員資料庫。正式營運前需完成雲端資料庫、驗證、權限與交易紀錄設定。</div>
</main><footer>夜市大玩家 · 自有品牌原型</footer>
<div id="modal" class="modal hidden"><div class="sheet"><button class="close" onclick="closeModal()">關閉</button><div id="modalBody"></div></div></div>
<script>
const gameData=[
["🎯","夜市射氣球","瞄準目標，挑戰高分"],["🥢","夾娃娃挑戰","眼明手快夾好物"],["🏀","投籃高手","連續命中拿獎勵"],["🎳","保齡球大賽","打倒所有瓶子"],["🐟","撈金魚","考驗你的手速"],["🔨","打地鼠","看到就要快打"],["🍬","彈珠台","讓彈珠落入高分區"],["🎈","戳氣球","找出隱藏大獎"],["🧋","珍奶調配師","調出完美比例"],["🍡","套圈圈","套中夜市好禮"],["🎣","釣魚達人","釣起稀有魚種"],["🧩","夜市拼圖","完成台灣風景"],["🎲","幸運骰子","試試你的手氣"],["🥁","節奏達人","跟上夜市節拍"],["🚗","碰碰車","閃避障礙物"],["🪙","金幣大冒險","收集散落金幣"]
];
const $=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem("nm_state")||'{"user":null,"points":100,"lastDaily":"","played":0,"collection":[],"scores":[]}');
function save(){localStorage.setItem("nm_state",JSON.stringify(state));render()}
function render(){
$("points").textContent=state.points;$("daily").textContent=state.lastDaily===new Date().toDateString()?"已領取":"未領取";$("collection").textContent=state.collection.length+" / 500";
$("loginBtn").textContent=state.user||"登入 / 註冊";
$("games").innerHTML=gameData.map((g,i)=>`<article class="game"><div><div class="emoji">${g[0]}</div><h3>${i+1}. ${g[1]}</h3><p>${g[2]} · 入場 5 點</p></div><button onclick="play(${i})">開始遊戲</button></article>`).join("");
let scores=[...(state.scores||[])].sort((a,b)=>b.score-a.score).slice(0,5);$("leaderboard").innerHTML=scores.length?scores.map((s,i)=>`<div class="item"><span>${["🥇","🥈","🥉","4️⃣","5️⃣"][i]} ${s.name}</span><b>${s.score} 分</b></div>`).join(""):'<div class="muted">開始遊戲後，這裡會顯示本機成績。</div>';
$("collectionList").textContent=state.collection.length?state.collection.join("、"):"還沒有收藏品，快去玩遊戲吧！";
}
function openModal(html){$("modalBody").innerHTML=html;$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden")}
$("loginBtn").onclick=()=>openModal(`<h2>會員登入 / 註冊</h2><p class="muted">原型版使用本機暱稱，不代表正式安全帳號。</p><label>你的暱稱</label><input id="nickname" maxlength="16" placeholder="輸入暱稱" value="${state.user||""}"><button onclick="setUser()">進入夜市</button>`);
window.setUser=()=>{let n=$("nickname").value.trim();if(!n)return alert("請輸入暱稱");state.user=n;save();closeModal()};
window.play=(i)=>{if(!state.user){alert("請先登入或註冊暱稱");$("loginBtn").click();return}if(state.points<5){alert("點數不足，請領取每日贈點");return}state.points-=5;save();let g=gameData[i];openModal(`<div style="font-size:38px">${g[0]}</div><h2>${g[1]}</h2><p>${g[2]}</p><p>完成挑戰即可獲得 8–20 點，並有機會獲得收藏品！</p><button onclick="finishGame(${i})">完成挑戰</button> <button class="secondary" onclick="closeModal()">離開</button>`);};
window.finishGame=(i)=>{let score= Math.floor(50+Math.random()*451),reward=8+Math.floor(Math.random()*13);state.points+=reward;state.played++;state.scores.push({name:state.user,score});let item=["珍珠奶茶","雞排","大腸包小腸","夜市燈籠","台灣黑熊吊飾","鳳梨酥"][Math.floor(Math.random()*6)];let got=Math.random()<.35&&!state.collection.includes(item);if(got)state.collection.push(item);save();openModal(`<h2>🎉 挑戰完成！</h2><p>本次得分：<b>${score}</b></p><p>獲得點數：<b style="color:var(--gold)">+${reward}</b></p><p>${got?"🎁 收藏到："+item:"再接再厲，收集台灣味！"}</p><button onclick="closeModal()">繼續逛夜市</button>`)}
$("adminBtn").onclick=()=>openModal(`<h2>🔐 管理員入口</h2><p class="muted">原型展示用密碼：<b>admin123</b>。正式版必須改為雲端安全驗證。</p><label>管理員密碼</label><input id="adminPass" type="password" placeholder="輸入管理員密碼"><button onclick="adminLogin()">登入後台</button>`);
window.adminLogin=()=>{if($("adminPass").value!=="admin123")return alert("密碼錯誤");openModal(`<h2>🛠 管理後台</h2><div class="panel"><b>平台概況</b><p>本機會員：${state.user||"尚無"}<br>目前點數：${state.points}<br>遊戲次數：${state.played}<br>收藏數：${state.collection.length}</p></div><label>會員暱稱（本機）</label><input value="${state.user||""}" disabled><label>調整點數（正數增加、負數扣除）</label><input id="adjust" type="number" placeholder="例如 100 或 -20"><button onclick="adjustPoints()">執行點數調整</button><hr style="border-color:#ffffff20;margin:18px 0"><button class="danger" onclick="resetDemo()">重設本機展示資料</button><p class="notice">此管理頁目前只管理本機展示資料；正式後台會有會員搜尋、點數流水帳、遊戲上下架、每日贈點設定及操作稽核。</p>`)}
window.adjustPoints=()=>{let n=Number($("adjust").value);if(!Number.isFinite(n)||!n)return alert("請輸入有效點數");if(state.points+n<0)return alert("點數不可低於 0");state.points+=n;save();adminLogin()};
window.resetDemo=()=>{if(!confirm("確定清除本機展示資料？"))return;localStorage.removeItem("nm_state");state={user:null,points:100,lastDaily:"",played:0,collection:[],scores:[]};save();closeModal()};
if(state.lastDaily!==new Date().toDateString()){ /* daily reward is claimed explicitly */ }
function claimDaily(){if(state.lastDaily===new Date().toDateString())return alert("今天已領取");state.points+=30;state.lastDaily=new Date().toDateString();save();alert("已領取每日 30 點！")}
$("daily").parentElement.style.cursor="pointer";$("daily").parentElement.title="點擊領取每日點數";$("daily").parentElement.onclick=claimDaily;
render();
</script></body></html>
